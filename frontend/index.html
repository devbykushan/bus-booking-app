<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/dewmina-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#090d16" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dewmina Super Line" />
    <meta name="application-name" content="Dewmina Super Line" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="preload" as="image" href="/yutong-hero.jpg" fetchpriority="high" />
    <title>Dewmina Super Line | Monaragala to Colombo Online Bus Seat Booking</title>
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-captured'));
      });
      (function() {
        try {
          var hostname = window.location.hostname.toLowerCase();
          var isSuperAdmin = hostname.indexOf('dewmina-super-admin') !== -1 ||
                             hostname.indexOf('super-admin') !== -1 ||
                             window.location.href.toLowerCase().indexOf('dew_super') !== -1;
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = isSuperAdmin ? '/manifest-superadmin.json' : '/manifest.webmanifest';
          document.head.appendChild(link);
          if (isSuperAdmin) {
            document.title = 'Dewmina Master Admin | Super Admin Command';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
